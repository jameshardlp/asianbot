<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="aurapay" content="6a70ee5492726">
    <title>Оплата через AuraPay</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: #f0f4f8;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 400px;
            width: 100%;
            background: white;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }
        .header { text-align: center; margin-bottom: 24px; }
        .header .icon { font-size: 48px; }
        .header h2 { color: #1a73e8; margin-top: 8px; font-size: 24px; }
        .amount {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
            text-align: center;
        }
        .amount .value { font-size: 32px; font-weight: bold; color: #1a73e8; }
        .amount .currency { font-size: 16px; color: #5f6368; }
        .payment-methods { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
        .payment-method {
            display: flex;
            align-items: center;
            padding: 16px;
            border: 2px solid #e8eaed;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            background: white;
        }
        .payment-method:hover { border-color: #1a73e8; background: #f8f9fa; }
        .payment-method.selected { border-color: #1a73e8; background: #e8f0fe; }
        .payment-method .icon { font-size: 24px; margin-right: 12px; }
        .payment-method .info { flex: 1; }
        .payment-method .info .name { font-weight: 600; color: #202124; }
        .payment-method .info .desc { font-size: 12px; color: #5f6368; }
        .payment-method .radio {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 2px solid #dadce0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .payment-method.selected .radio { border-color: #1a73e8; }
        .payment-method.selected .radio::after {
            content: '';
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #1a73e8;
        }
        .btn-pay {
            width: 100%;
            padding: 16px;
            background: #1a73e8;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-pay:hover:not(:disabled) { background: #1557b0; transform: translateY(-1px); }
        .btn-pay:disabled { background: #dadce0; cursor: not-allowed; opacity: 0.7; }
        .status {
            text-align: center;
            padding: 16px;
            border-radius: 12px;
            margin-top: 16px;
            display: none;
            font-weight: 500;
        }
        .status.success { display: block; background: #e6f4ea; color: #1e7e34; }
        .status.error { display: block; background: #fce8e6; color: #d93025; }
        .status.loading { display: block; background: #e8f0fe; color: #1a73e8; }
        #payment-frame {
            width: 100%;
            height: 400px;
            border: none;
            border-radius: 12px;
            margin-top: 16px;
            display: none;
            background: #f8f9fa;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 16px;
            color: #5f6368;
            text-decoration: none;
            font-size: 14px;
            cursor: pointer;
            padding: 8px;
        }
        .back-link:hover { color: #1a73e8; }
        
        /* Стили для Telegram Mini App */
        .telegram-header {
            display: none;
        }
        .container {
            margin-top: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="icon">💳</div>
            <h2>Оплата через AuraPay</h2>
        </div>
        
        <div class="amount">
            <div class="value" id="amount">0</div>
            <div class="currency" id="currency">RUB</div>
        </div>
        
        <div class="payment-methods">
            <div class="payment-method selected" data-method="card" onclick="selectMethod('card')">
                <div class="icon">💳</div>
                <div class="info">
                    <div class="name">Банковская карта</div>
                    <div class="desc">Visa, Mastercard, МИР</div>
                </div>
                <div class="radio"></div>
            </div>
            <div class="payment-method" data-method="sbp" onclick="selectMethod('sbp')">
                <div class="icon">📱</div>
                <div class="info">
                    <div class="name">СБП</div>
                    <div class="desc">Система быстрых платежей</div>
                </div>
                <div class="radio"></div>
            </div>
            <div class="payment-method" data-method="crypto" onclick="selectMethod('crypto')">
                <div class="icon">₿</div>
                <div class="info">
                    <div class="name">Криптовалюта</div>
                    <div class="desc">USDT, BTC, ETH</div>
                </div>
                <div class="radio"></div>
            </div>
        </div>
        
        <button class="btn-pay" id="payBtn" onclick="pay()">💳 Оплатить</button>
        
        <div class="status" id="status"></div>
        
        <iframe id="payment-frame"></iframe>
        
        <a class="back-link" onclick="closeApp()">✕ Закрыть</a>
    </div>
    
    <!-- Подключаем Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <script>
        // ===== ИНИЦИАЛИЗАЦИЯ TELEGRAM MINI APP =====
        // Проверяем, запущено ли приложение в Telegram
        let tg = null;
        try {
            tg = window.Telegram?.WebApp;
            if (tg) {
                tg.ready(); // Сообщаем Telegram, что приложение готово
                tg.expand(); // Растягиваем на весь экран
                console.log('✅ Telegram Mini App инициализирован');
            } else {
                console.log('⚠️ Приложение запущено вне Telegram');
            }
        } catch (e) {
            console.warn('⚠️ Ошибка инициализации Telegram:', e);
        }
        
        // ===== КОНФИГУРАЦИЯ =====
        // URL вашего бота на Railway
        const BOT_API_URL = 'https://asianbot-production.up.railway.app';
        
        // Получаем параметры из URL
        const urlParams = new URLSearchParams(window.location.search);
        const orderId = urlParams.get('order_id') || '';
        const userId = urlParams.get('user_id') || '';
        const amount = urlParams.get('amount') || '100';
        const currency = urlParams.get('currency') || 'RUB';
        
        // Устанавливаем сумму
        document.getElementById('amount').textContent = amount;
        document.getElementById('currency').textContent = currency;
        
        // Если есть Telegram, пробуем получить данные пользователя
        if (tg && tg.initDataUnsafe?.user) {
            const user = tg.initDataUnsafe.user;
            console.log('👤 Пользователь Telegram:', user.id, user.username || user.first_name);
        }
        
        let selectedMethod = 'card';
        
        function selectMethod(method) {
            selectedMethod = method;
            document.querySelectorAll('.payment-method').forEach(el => {
                el.classList.remove('selected');
                if (el.dataset.method === method) {
                    el.classList.add('selected');
                }
            });
        }
        
        function showStatus(text, type) {
            const statusEl = document.getElementById('status');
            statusEl.className = 'status ' + type;
            statusEl.textContent = text;
            statusEl.style.display = 'block';
            
            // Если есть Telegram, вибрируем при ошибке
            if (tg && type === 'error') {
                try { tg.HapticFeedback.impactOccurred('error'); } catch(e) {}
            }
        }
        
        function hideStatus() {
            document.getElementById('status').style.display = 'none';
        }
        
        async function pay() {
            const btn = document.getElementById('payBtn');
            btn.disabled = true;
            btn.textContent = '⏳ Обработка...';
            hideStatus();
            
            // Визуальная обратная связь
            if (tg) {
                try { tg.HapticFeedback.impactOccurred('light'); } catch(e) {}
            }
            
            try {
                // Создаем платеж через API бота
                const response = await fetch(`${BOT_API_URL}/api/aurapay/create`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        order_id: orderId,
                        user_id: userId,
                        amount: amount,
                        currency: currency,
                        method: selectedMethod
                    })
                });
                
                const data = await response.json();
                
                if (!data.success) {
                    showStatus('❌ ' + data.error, 'error');
                    btn.disabled = false;
                    btn.textContent = '💳 Оплатить';
                    if (tg) {
                        try { tg.HapticFeedback.notificationOccurred('error'); } catch(e) {}
                    }
                    return;
                }
                
                if (data.payment_url) {
                    const frame = document.getElementById('payment-frame');
                    frame.style.display = 'block';
                    frame.src = data.payment_url;
                    showStatus('⏳ Ожидайте оплаты...', 'loading');
                    
                    // Проверяем статус каждые 3 секунды
                    let attempts = 0;
                    const maxAttempts = 60;
                    const interval = setInterval(async () => {
                        attempts++;
                        try {
                            const statusResponse = await fetch(`${BOT_API_URL}/api/aurapay/status`, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ order_id: orderId })
                            });
                            const statusData = await statusResponse.json();
                            
                            if (statusData.status === 'paid' || statusData.status === 'success') {
                                clearInterval(interval);
                                showStatus('✅ Оплата прошла успешно!', 'success');
                                btn.textContent = '✅ Оплачено';
                                btn.disabled = true;
                                if (tg) {
                                    try { tg.HapticFeedback.notificationOccurred('success'); } catch(e) {}
                                    // Закрываем через 2 секунды
                                    setTimeout(() => {
                                        tg.close();
                                    }, 2000);
                                } else {
                                    setTimeout(() => closeApp(), 2000);
                                }
                            } else if (attempts >= maxAttempts) {
                                clearInterval(interval);
                                showStatus('⏱️ Время ожидания истекло', 'error');
                                btn.disabled = false;
                                btn.textContent = '💳 Оплатить';
                            }
                        } catch (e) {
                            console.error('Ошибка проверки статуса:', e);
                            if (attempts >= maxAttempts) {
                                clearInterval(interval);
                                showStatus('⏱️ Время ожидания истекло', 'error');
                                btn.disabled = false;
                                btn.textContent = '💳 Оплатить';
                            }
                        }
                    }, 3000);
                    
                } else {
                    showStatus('❌ Не удалось создать платеж', 'error');
                    btn.disabled = false;
                    btn.textContent = '💳 Оплатить';
                }
                
            } catch (error) {
                console.error('Payment error:', error);
                showStatus('❌ Ошибка при создании платежа', 'error');
                btn.disabled = false;
                btn.textContent = '💳 Оплатить';
                if (tg) {
                    try { tg.HapticFeedback.notificationOccurred('error'); } catch(e) {}
                }
            }
        }
        
        function closeApp() {
            if (tg) {
                tg.close();
            } else {
                window.close();
            }
        }
        
        // Закрытие по Esc
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeApp();
        });
        
        // ===== ОБРАБОТКА ИЗМЕНЕНИЯ РАЗМЕРА ОКНА В TELEGRAM =====
        if (tg) {
            tg.onEvent('viewportChanged', function() {
                console.log('📱 Размер окна изменился');
            });
            
            // Показываем кнопку "Назад" в Telegram
            tg.BackButton.show();
            tg.BackButton.onClick(function() {
                closeApp();
            });
        }
        
        console.log('🚀 Mini App AuraPay загружен');
        console.log(`📦 Заказ: ${orderId}, Пользователь: ${userId}, Сумма: ${amount} ${currency}`);
    </script>
</body>
</html>
